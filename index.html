<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your spending for today.</p>
            </div>

            <span id="currentDate"></span>
        </header>

        <section class="summary">
            <div class="summary-card budget-card">
                <span>Daily Budget</span>
                <strong id="budgetDisplay">₱0.00</strong>
            </div>

            <div class="summary-card">
                <span>Total Expenses</span>
                <strong id="totalDisplay">₱0.00</strong>
            </div>

            <div class="summary-card">
                <span>Remaining</span>
                <strong id="remainingDisplay">₱0.00</strong>
            </div>
        </section>

        <section class="forms">

            <div class="card">
                <h2>Set Daily Budget</h2>

                <form id="budgetForm">
                    <label for="budget">Budget</label>

                    <div class="amount-input">
                        <span>₱</span>
                        <input
                            type="number"
                            id="budget"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <button type="submit">Set Budget</button>
                </form>
            </div>

            <div class="card">
                <h2>Add Expense</h2>

                <form id="expenseForm">
                    <label for="amount">Amount</label>

                    <div class="amount-input">
                        <span>₱</span>
                        <input
                            type="number"
                            id="amount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="What did you spend on?"
                        required
                    >

                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Choose a category</option>
                        <option value="Food">Food</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>

                    <button type="submit">Add Expense</button>
                </form>
            </div>

        </section>

        <section class="card expenses-card">
            <div class="expenses-header">
                <div>
                    <h2>Today's Expenses</h2>
                    <span id="expenseCount">0 expenses</span>
                </div>
            </div>

            <div id="expenseList">
                <div class="empty-state">
                    No expenses recorded today.
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
